<form #formulario="ngForm" (ngSubmit)="login()" class="mx-auto mt-10 max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-lg sm:p-8">
  <h1 class="mb-6 text-2xl font-bold text-slate-900">Iniciar sesión</h1>
  <label class="mb-4 block text-sm font-semibold text-slate-700">Email
    <input type="text" #email class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
  </label>
  <label class="mb-6 block text-sm font-semibold text-slate-700">Contraseña
    <input type="password" #password class="mt-2 block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
  </label>
  <button class="w-full rounded-lg bg-sky-500 px-4 py-3 font-semibold text-white transition hover:bg-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-300">Entrar</button>
</form>
