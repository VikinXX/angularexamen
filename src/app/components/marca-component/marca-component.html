<section class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <h1 class="mb-8 text-3xl font-bold text-slate-900">Cubos de {{marca}}</h1>
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for(cubo of cubos; track cubo) {
      <article class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-lg">
        <img src="{{cubo.imagen}}" alt="{{cubo.nombre}}" class="h-52 w-full bg-slate-50 object-contain p-4">
        <div class="p-5">
          <h2 class="text-xl font-bold text-slate-900">{{cubo.nombre}}</h2>
          <p class="mt-3 text-sm text-slate-600">Marca: {{cubo.marca}}</p>
          <p class="text-sm text-slate-600">Modelo: {{cubo.modelo}}</p>
          <p class="mt-3 text-2xl font-bold text-sky-600">{{cubo.precio}} €</p>
          @if(token){
            <button (click)="insertarPedido(cubo.idCubo)" class="mt-4 w-full rounded-lg bg-sky-500 px-4 py-2.5 font-semibold text-white transition hover:bg-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-300">Añadir al pedido</button>
          }
        </div>
      </article>
    }
  </div>
</section>
