<section class="mx-auto max-w-2xl px-4 py-8 sm:px-6">
  @if (user) {
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-lg sm:p-8">
      <div class="mb-6 flex items-center gap-4">
        <div class="grid h-14 w-14 place-items-center rounded-full bg-sky-100 text-xl font-bold text-sky-700">U</div>
        <h1 class="text-2xl font-bold text-slate-900">Perfil de {{user.nombre}}</h1>
      </div>
      <div class="space-y-3 rounded-xl bg-slate-50 p-4 text-slate-700">
        <p><span class="font-semibold">Email:</span> {{user.email}}</p>
        <p><span class="font-semibold">Password:</span> {{user.pass}}</p>
      </div>
    </div>
  }
</section>
